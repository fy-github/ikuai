server {
  listen 8080;
  server_name _;

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  location = / {
    default_type text/html;
    return 200 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nullclaw 已启动</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1622;color:#eef4fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{max-width:720px;padding:36px;border:1px solid #2fe8c2;border-radius:18px;background:#111d2b;box-shadow:0 18px 60px rgba(0,0,0,.3)}h1{margin:0 0 14px;font-size:30px}p{line-height:1.8;color:#b9c7d6}.ok{display:inline-block;margin-bottom:18px;padding:6px 12px;border-radius:999px;background:#12392f;color:#5ff3ce;font-weight:700}code{color:#5ff3ce}.actions{margin-top:22px}.actions a{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:8px;background:#2fe8c2;color:#071017;text-decoration:none;font-weight:700}</style></head><body><main class="panel"><span class="ok">运行正常</span><h1>Nullclaw 网关已启动</h1><p>当前爱快应用已成功启动。健康检查接口：<code>/health</code>。局域网聊天页位于 <code>/chat</code>，第三方接入路径继续透传到 Nullclaw 网关。</p><div class="actions"><a href="/chat">打开局域网聊天</a></div></main></body></html>';
  }

  location = /chat {
    default_type text/html;
    alias /usr/share/nginx/html/chat.html;
  }

  location = /api/chat {
    proxy_pass http://nullclaw:32124/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Chat-Token $http_x_chat_token;
    proxy_set_header X-Sender-Id $http_x_sender_id;
    proxy_set_header X-Session-Id $http_x_session_id;
    proxy_request_buffering on;
    proxy_buffering off;
  }

  location = /api/chat/health {
    proxy_pass http://nullclaw:32124/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://nullclaw:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
