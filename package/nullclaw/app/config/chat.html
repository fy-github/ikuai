<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nullclaw 局域网聊天</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #d8e0ea;
      --text: #142033;
      --muted: #5b6778;
      --brand: #0f8f7d;
      --brand-strong: #08715f;
      --danger: #b42318;
      --user: #e7f7f3;
      --assistant: #f6f8fb;
      --system: #fff9e8;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #98a2b3;
    }

    .status[data-state="ready"] .dot { background: #0f8f7d; }
    .status[data-state="error"] .dot { background: var(--danger); }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      overflow: hidden;
    }

    aside {
      border-right: 1px solid var(--line);
      background: #fbfcfe;
      padding: 16px;
      overflow: auto;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input, textarea, button {
      font: inherit;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    input {
      height: 38px;
      padding: 0 10px;
    }

    input:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 143, 125, .14);
    }

    .toolbar {
      display: grid;
      gap: 8px;
    }

    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-weight: 650;
    }

    button.primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    button.primary:hover { background: var(--brand-strong); }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .chat {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      background: var(--panel);
      overflow: hidden;
    }

    .messages {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px;
    }

    .empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    .msg {
      max-width: 860px;
      margin: 0 0 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.65;
    }

    .msg.user {
      margin-left: auto;
      background: var(--user);
      border-color: #bde6dc;
    }

    .msg.assistant {
      background: var(--assistant);
    }

    .msg.system {
      max-width: none;
      color: var(--muted);
      background: var(--system);
      border-color: #f0d99a;
      font-size: 13px;
    }

    .msg.typing {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 72px;
    }

    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 16px;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8a94a6;
      animation: typingPulse 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .3s; }

    @keyframes typingPulse {
      0%, 80%, 100% { transform: scale(.7); opacity: .45; }
      40% { transform: scale(1); opacity: 1; }
    }

    form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      background: #fbfcfe;
    }

    textarea {
      min-height: 44px;
      max-height: 140px;
      resize: vertical;
      padding: 10px 12px;
    }

    form button {
      width: 84px;
    }

    .hint {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    code {
      color: var(--brand-strong);
      word-break: break-all;
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      form {
        grid-template-columns: 1fr;
      }

      form button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Nullclaw 局域网聊天</h1>
      <div id="status" class="status" data-state="idle"><span class="dot"></span><span>未就绪</span></div>
    </header>
    <main>
      <aside>
        <div class="field">
          <label for="apiBase">网关地址</label>
          <input id="apiBase" autocomplete="off">
        </div>
        <div class="field">
          <label for="bearerToken">访问令牌</label>
          <input id="bearerToken" autocomplete="off" spellcheck="false" placeholder="请填写与页面配置一致的令牌">
        </div>
        <div class="field">
          <label for="senderId">发送者 ID</label>
          <input id="senderId" autocomplete="off" spellcheck="false">
        </div>
        <div class="toolbar">
          <button id="checkBtn" class="primary" type="button">检查</button>
          <button id="clearBtn" type="button">清空消息</button>
        </div>
        <p class="hint">此页面走本地同步桥 <code>/api/chat</code>。第三方接入仍然使用原路径，例如 <code>/lark</code>、<code>/telegram</code>、<code>/slack/events</code>。</p>
      </aside>
      <section class="chat">
        <div id="messages" class="messages">
          <div class="empty">检查通过后输入消息即可开始对话。</div>
        </div>
        <form id="sendForm">
          <textarea id="messageInput" placeholder="输入消息，Ctrl+Enter 发送" disabled></textarea>
          <button id="sendBtn" class="primary" type="submit" disabled>发送</button>
        </form>
      </section>
    </main>
  </div>

  <script>
    const DEFAULT_TOKEN = "ikuai8.com";
    const storagePrefix = "nullclaw.chat.http.";
    const statusEl = document.getElementById("status");
    const messagesEl = document.getElementById("messages");
    const apiBaseEl = document.getElementById("apiBase");
    const bearerTokenEl = document.getElementById("bearerToken");
    const senderIdEl = document.getElementById("senderId");
    const checkBtn = document.getElementById("checkBtn");
    const clearBtn = document.getElementById("clearBtn");
    const sendForm = document.getElementById("sendForm");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    let ready = false;
    let typingBubble = null;

    function defaultApiBase() {
      return `${location.protocol}//${location.host}`;
    }

    function loadSettings() {
      apiBaseEl.value = localStorage.getItem(storagePrefix + "apiBase") || defaultApiBase();
      bearerTokenEl.value = localStorage.getItem(storagePrefix + "bearerToken") || DEFAULT_TOKEN;
      senderIdEl.value = localStorage.getItem(storagePrefix + "senderId") || "lan-user";
    }

    function saveSettings() {
      localStorage.setItem(storagePrefix + "apiBase", apiBaseEl.value.trim());
      localStorage.setItem(storagePrefix + "bearerToken", bearerTokenEl.value.trim());
      localStorage.setItem(storagePrefix + "senderId", senderIdEl.value.trim() || "lan-user");
    }

    function setStatus(state, text) {
      statusEl.dataset.state = state;
      statusEl.querySelector("span:last-child").textContent = text;
    }

    function setReady(value) {
      ready = value;
      messageInput.disabled = !value;
      sendBtn.disabled = !value;
      if (value) messageInput.focus();
    }

    function ensureMessageList() {
      const empty = messagesEl.querySelector(".empty");
      if (empty) empty.remove();
    }

    function appendMessage(role, text) {
      ensureMessageList();
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function appendTypingMessage() {
      ensureMessageList();
      const div = document.createElement("div");
      div.className = "msg assistant typing";
      div.innerHTML = '<span>正在输入</span><span class="typing-dots"><span></span><span></span><span></span></span>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function healthCheck() {
      saveSettings();
      const apiBase = apiBaseEl.value.trim() || defaultApiBase();
      try {
        const response = await fetch(`${apiBase}/health`, { cache: "no-store" });
        const text = await response.text();
        if (!response.ok) throw new Error(text || `HTTP ${response.status}`);
        setStatus("ready", "已就绪");
        setReady(true);
        appendMessage("system", "健康检查通过。");
      } catch (error) {
        setStatus("error", "健康检查失败");
        setReady(false);
        appendMessage("system", `健康检查失败：${error.message}`);
      }
    }

    async function sendMessage(text) {
      if (!ready) return;
      const content = text.trim();
      if (!content) return;
      const apiBase = apiBaseEl.value.trim() || defaultApiBase();
      const bearerToken = bearerTokenEl.value.trim();
      const senderId = senderIdEl.value.trim() || "lan-user";
      appendMessage("user", content);
      typingBubble = appendTypingMessage();
      try {
        const response = await fetch(`${apiBase}/api/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=UTF-8",
            "X-Chat-Token": bearerToken,
            "X-Sender-Id": senderId,
            "X-Session-Id": senderId
          },
          body: content
        });
        const raw = await response.text();
        if (!response.ok) {
          let data = null;
          try {
            data = JSON.parse(raw);
          } catch (_) {}
          throw new Error((data && (data.error || data.message)) || raw || `HTTP ${response.status}`);
        }
        if (typingBubble) {
          typingBubble.className = "msg assistant";
          typingBubble.textContent = raw || "当前请求没有返回内容。";
          typingBubble = null;
        } else {
          appendMessage("assistant", raw || "当前请求没有返回内容。");
        }
      } catch (error) {
        if (typingBubble) {
          typingBubble.remove();
          typingBubble = null;
        }
        appendMessage("system", `请求失败：${error.message}`);
      }
    }

    checkBtn.addEventListener("click", healthCheck);
    clearBtn.addEventListener("click", () => {
      messagesEl.innerHTML = '<div class="empty">检查通过后输入消息即可开始对话。</div>';
      typingBubble = null;
    });
    sendForm.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(messageInput.value);
      messageInput.value = "";
    });
    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.ctrlKey) {
        event.preventDefault();
        sendForm.requestSubmit();
      }
    });

    loadSettings();
  </script>
</body>
</html>
